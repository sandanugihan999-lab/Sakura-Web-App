<!DOCTYPE html>
<html lang="si"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAKURA Class Manager</title>
<style>
:rootbg:#faf6f7;--ink:#1b1417;--pink:#c2185b;--ok:#1b7f3b;--bad:#c62828;--line:#e6d9dd;--card:#fff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:Georgia,"Iskoola Pota",serif;font-size:16px}
header{background:#000;color:#fff;text-align:center;padding:14px 10px 10px}
header h1{margin:0;font-size:30px;letter-spacing:.35em;padding-left:.35em}
header p{margin:2px 0 0;font-size:13px;color:#e9b6c8}
nav{display:flex;justify-content:center;gap:8px;padding:12px}
button,select,input{font:inherit}
nav button,.btn{border:2px solid var(--ink);background:#fff;padding:9px 18px;border-radius:6px;cursor:pointer}
nav button.on,.btn.p{background:var(--pink);border-color:var(--pink);color:#fff}
main{flex:1;width:100%;max-width:960px;margin:0 auto;padding:0 14px 14px}
.box{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:14px}
input,select{padding:10px;border:1px solid #bbb;border-radius:6px;background:#fff;max-width:100%}
#scan{width:100%;font-size:22px;border:2px solid var(--pink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.res{text-align:center;padding:22px 10px}
.res h2{margin:0 0 4px;font-size:30px}
.big{font-size:46px;font-weight:700;margin:10px 0}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.muted{color:#6d5b61;font-size:14px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:700;border-bottom:2px solid var(--ink)}
.wrap{overflow-x:auto}
.tag{display:inline-block;padding:2px 10px;border-radius:12px;color:#fff;font-size:14px}
.tag.ok{background:var(--ok)}.tag.bad{background:var(--bad)}
details summary{cursor:pointer;color:var(--pink)}
footer{text-align:center;padding:12px;font-size:13px;color:#6d5b61}
.hide{display:none}
:focus-visible{outline:3px solid #1565c0;outline-offset:2px}
</style></head>

    <p id="empty" class="muted hide">Students kenek nehe. Card ekak scan karala hari, yata form eken hari add karanna.</p>
  </div>
  <div class="box">
    <b>Student add karanna</b>
    <div class="row" style="margin-top:8px"><input id="sc" placeholder="Card number (scan karanna puluwan)"><input id="sq" placeholder="QR value (optional)"><input id="sn" placeholder="Name"><input id="sp" placeholder="Phone (optional)"><select id="scl"></select><button class="btn p" id="sadd">Add student</button></div>
  </div>
  <div class="box">
    <b>New class add karanna</b>
    <div class="row" style="margin-top:8px"><input id="cn" placeholder="Class / subject name"><button class="btn p" id="cadd">Add class</button></div>
    <div id="clist" class="muted"></div>
  </div>
  <div class="box">
    <b>Backup</b>
    <div class="row" style="margin-top:8px"><button class="btn" id="bk">Backup download</button><label class="btn">Restore backup<input type="file" id="rs" accept=".json" class="hide"></label></div>
  </div>
</section>

</main>
<footer>Engineered by GIHAN SANDANU</footer>

<script>
const K='sakura_db_v1',SALT='sakura-v1-salt',DEF='55efd6fb574df9ba44f0c2ac8cdab85aeafc6d4c8c7907d252738dd4b45ead0f';
let rt,idle;
async function H(p,salt){if(!window.crypto||!crypto.subtle)throw 0;
  const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveBits']);
  const b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(salt),iterations:100000,hash:'SHA-256'},k,256);
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
let db={classes:[{id:'c1',name:'Class 1'}],students:[],att:[],paid:{}};
try{const s=localStorage.getItem(K);if(s)db=JSON.parse(s)}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(db))}catch(e){}};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toLocaleDateString('en-CA');
const cname=id=>(db.classes.find(c=>c.id===id)||{name:'-'}).name;
let unlocked=false,view='scan';

function days(code,m){return [...new Set(db.att.filter(a=>a.code===code&&a.date.startsWith(m)).map(a=>a.date))].sort()}
function opts(sel,all){const v=sel.value;sel.innerHTML=(all?'<option value="">All classes</option>':'')+db.classes.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');if(v)sel.value=v}
function fillClasses(){['cls','fcls','scl'].forEach(i=>opts($(i),i==='fcls'));
  $('clist').textContent='Classes: '+db.classes.map(c=>c.name).join(', ')}

function show(v){view=v;
  $('v-scan').classList.toggle('hide',v!=='scan');
  $('v-dash').classList.toggle('hide',!(v==='dash'&&unlocked));
  if(v==='scan')$('scan').focus();
  else{camOff();renderDash()}
}

/* scan */
function record(s,date){
  const cid=$('cls').value||s.classId;
  const first=!db.att.some(a=>a.code===s.code&&a.date===date&&a.classId===cid);
  if(first){db.att.push({code:s.code,date,classId:cid});save()}
  const m=date.slice(0,7),paid=!!db.paid[s.code+'|'+m];
  $('res').innerHTML=`<div class="box res">
    <h2>${esc(s.name)}</h2><div class="muted">${esc(cname(cid))} &middot; ${date}</div>
    <div class="big ${paid?'ok':'bad'}">${paid?'Fee paid':'Fee not paid'}</div>
    <div>${first?'Class eka dunna (recorded)':'Ada dawase me class eka kalinma record karala'}</div>
    <div class="muted" style="margin-top:6px">Me masa class gaana: ${days(s.code,m).length} dawas</div></div>`;
  clearTimeout(rt);rt=setTimeout(()=>{$('res').innerHTML=''},8000);
}
async function onScan(raw){
  const code=raw.trim();if(!code)return;
  const s=db.students.find(x=>x.code===code||(x.qr&&x.qr===code));
  if(s){record(s,today());return}
  if(await tryOwner(code))return;
  $('res').innerHTML='<div class="box res"><b>Me card eka register wela nehe.</b><div class="muted">Class owner ta kiyanna.</div></div>';
  clearTimeout(rt);rt=setTimeout(()=>{$('res').innerHTML=''},8000);
}
$('scan').addEventListener('keydown',e=>{if(e.key==='Enter'){onScan(e.target.value);e.target.value=''}});
document.addEventListener('click',e=>{if(view==='scan'&&!/INPUT|SELECT|BUTTON/.test(e.target.tagName))$('scan').focus()});

/* dashboard */
function renderDash(){
  if(!$('mon').value)$('mon').value=today().slice(0,7);
  const m=$('mon').value,fc=$('fcls').value,q=$('q').value.toLowerCase();
  const list=db.students.filter(s=>(!fc||s.classId===fc)&&(!$('unp').checked||!db.paid[s.code+'|'+m])&&(s.name.toLowerCase().includes(q)||s.code.toLowerCase().includes(q)));
  $('empty').classList.toggle('hide',db.students.length>0);
  $('rows').innerHTML=list.map(s=>{
    const d=days(s.code,m),p=!!db.paid[s.code+'|'+m];
    return `<tr><td>${esc(s.name)}<div class="muted">${esc(s.code)}${s.phone?' &middot; '+esc(s.phone):''}</div></td><td>${esc(cname(s.classId))}</td>
    <td><b>${d.length}</b>${d.length?`<details><summary>dawas</summary><span class="muted">${d.map(x=>x.slice(8)).join(', ')}</span></details>`:''}</td>
    <td><label><input type="checkbox" data-c="${esc(s.code)}" ${p?'checked':''}> <span class="tag ${p?'ok':'bad'}">${p?'Paid':'Not paid'}</span></label></td><td><button class="btn" data-e="${esc(s.code)}">Edit</button> <button class="btn" data-d="${esc(s.code)}">Delete</button></td></tr>`}).join('');
}
$('rows').addEventListener('change',e=>{const c=e.target.dataset.c;if(!c)return;
  const k=c+'|'+$('mon').value;if(e.target.checked)db.paid[k]=true;else delete db.paid[k];save();renderDash()});
['mon','fcls','q','unp'].forEach(i=>$(i).addEventListener('input',renderDash));
$('sadd').onclick=()=>{const c=$('sc').value.trim(),n=$('sn').value.trim(),q=$('sq').value.trim();if(!c||!n)return;
  if(db.students.some(s=>s.code===c||s.qr===c||(q&&(s.code===q||s.qr===q)))){alert('Me card number / QR eka kalinma thiyenawa');return}
  db.students.push({code:c,qr:q,phone:$('sp').value.trim(),name:n,classId:$('scl').value});save();$('sc').value=$('sq').value=$('sn').value=$('sp').value='';renderDash()};
$('rows').addEventListener('click',e=>{const t=e.target,d=t.dataset.d,ed=t.dataset.e;
  if(d&&confirm('Me student wa delete karanawada? Attendance saha fee data ekath yanawa.')){
    db.students=db.students.filter(s=>s.code!==d);db.att=db.att.filter(a=>a.code!==d);
    Object.keys(db.paid).forEach(k=>{if(k.startsWith(d+'|'))delete db.paid[k]});save();renderDash()}
  if(ed){const s=db.students.find(x=>x.code===ed);if(!s)return;
    const n=prompt('Name',s.name);if(n===null)return;
    const ph=prompt('Phone',s.phone||'');if(ph===null)return;
    const q=prompt('QR value',s.qr||'');if(q===null)return;
    s.name=n.trim()||s.name;s.phone=ph.trim();s.qr=q.trim();save();renderDash()}});
$('cadd').onclick=()=>{const n=$('cn').value.trim();if(!n)return;
  db.classes.push({id:'c'+Date.now(),name:n});save();$('cn').value='';fillClasses()};

/* pin + nav */
async function tryOwner(code){
  if(Date.now()<(db.lock||0))return false;
  let ok=false;
  try{ok=(await H(code,SALT))===DEF}catch(e){return false}
  if(ok){db.fail=0;delete db.lock;save();unlocked=true;$('res').innerHTML='';show('dash');bump();return true}
  db.fail=(db.fail||0)+1;if(db.fail>=5)db.lock=Date.now()+60000*(db.fail-4);save();return false}
function bump(){clearTimeout(idle);if(unlocked)idle=setTimeout(()=>{unlocked=false;show('scan')},120000)}
['click','keydown','mousemove','touchstart'].forEach(e=>document.addEventListener(e,bump));
$('lock').onclick=()=>{unlocked=false;clearTimeout(idle);show('scan')};

$('bk').onclick=()=>{const {classes,students,att,paid}=db;
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({classes,students,att,paid})],{type:'application/json'}));
  a.download='sakura-backup-'+today()+'.json';a.click()};
$('rs').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);
    if(!Array.isArray(d.classes)||!Array.isArray(d.students)||!Array.isArray(d.att)||typeof d.paid!=='object')throw 0;
    if(!confirm('Dan thiyena data okkoma me backup eken replace wenawa. Hari da?'))return;
    db={...db,classes:d.classes,students:d.students,att:d.att,paid:d.paid};save();fillClasses();renderDash()}
    catch(x){alert('Me file eka backup file ekak wage nemei.')}};r.readAsText(f)};
let stream,camTimer,lastC='',lastT=0,bd=null;
async function camOn(){
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}})}
  catch(e){alert('Camera eka open karanna bari una. Camera permission denna.');return}
  const v=$('vid');v.srcObject=stream;v.classList.remove('hide');await v.play();
  if('BarcodeDetector' in window){try{bd=new BarcodeDetector({formats:['qr_code']})}catch(e){bd=null}}
  if(!bd&&!window.jsQR)await new Promise(r=>{const sc=document.createElement('script');
    sc.src='https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js';sc.onload=sc.onerror=r;document.head.appendChild(sc)});
  if(!bd&&!window.jsQR){alert('Me browser eka camera QR scan support karanne nehe. Internet on karala aye try karanna, ho Chrome use karanna.');camOff();return}
  $('camBtn').textContent='Camera off karanna';camTimer=setInterval(camTick,250);
}
function camOff(){clearInterval(camTimer);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;
  $('vid').classList.add('hide');$('camBtn').textContent='Camera eken scan karanna'}
async function camTick(){
  const v=$('vid');if(v.readyState<2)return;let code='';
  try{if(bd){const r=await bd.detect(v);if(r.length)code=r[0].rawValue}
    else{const c=$('cv'),x=c.getContext('2d',{willReadFrequently:true});c.width=v.videoWidth;c.height=v.videoHeight;
      x.drawImage(v,0,0);const d=x.getImageData(0,0,c.width,c.height),q=jsQR(d.data,c.width,c.height);if(q)code=q.data}}catch(e){}
  const now=Date.now();if(!code||(code===lastC&&now-lastT<4000))return;lastC=code;lastT=now;onScan(code);
}
$('camBtn').onclick=()=>stream?camOff():camOn();
fillClasses();show('scan');
</script>
</body></html>
