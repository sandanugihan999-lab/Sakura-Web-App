<!DOCTYPE html>
<html lang="si"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14090d">
<title>SAKURA Class Manager</title>
<style>
:root{--bg:#fbf5f6;--ink:#1d1216;--pink:#c2185b;--pink2:#fde8f0;--ok:#157a37;--ok2:#e3f5e9;--bad:#c62828;--bad2:#fdeaea;--line:#ecdde2;--card:#fff;--mut:#7a6670;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Iskoola Pota","Noto Sans Sinhala",Roboto,sans-serif;font-size:16px;line-height:1.35}
button,select,input{font:inherit;color:inherit}
header{background:linear-gradient(135deg,#14090d,#2c1019);color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:20}
header h1{margin:0;font-size:22px;letter-spacing:.3em;font-weight:700}
header p{margin:2px 0 0;font-size:11.5px;color:#f1b3cb;letter-spacing:.02em}
.lockbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer}
main{flex:1;width:100%;max-width:720px;margin:0 auto;padding:14px 14px 100px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(60,10,30,.04)}
h2{font-size:19px;margin:0 0 12px}
h3{font-size:15px;margin:0 0 8px}
.muted{color:var(--mut);font-size:13.5px}
.hide{display:none!important}
label.f{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:0 0 4px}
input,select{width:100%;padding:13px 14px;border:1.5px solid #d9c9cf;border-radius:12px;background:#fff;min-height:48px}
input:focus,select:focus{outline:none;border-color:var(--pink);box-shadow:0 0 0 3px var(--pink2)}
.field{margin-bottom:12px}
.btn{border:0;border-radius:12px;padding:0 18px;min-height:48px;font-weight:600;cursor:pointer;background:#f1e7ea;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.98)}
.btn.p{background:var(--pink);color:#fff}
.btn.d{background:var(--bad2);color:var(--bad)}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px;border-radius:10px}
.btn.full{width:100%}
.row{display:flex;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* scan */
#scan{font-size:20px;border:2px solid var(--pink);margin-top:10px}
.res{text-align:center;padding:24px 12px}
.res h2{font-size:26px;margin:0 0 4px}
.big{font-size:40px;font-weight:800;margin:10px 0;border-radius:14px;padding:12px}
.big.ok{background:var(--ok2);color:var(--ok)}.big.bad{background:var(--bad2);color:var(--bad)}
/* dashboard */
.mbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.mbar input{flex:1}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stat b{display:block;font-size:30px;line-height:1.1}
.stat span{font-size:13px;color:var(--mut)}
.stat.ok b{color:var(--ok)}.stat.bad b{color:var(--bad)}.stat.pk b{color:var(--pink)}
.bar{height:9px;background:#f1e4e9;border-radius:9px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:9px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font-size:14px;cursor:pointer}
.chip.on{background:var(--pink);border-color:var(--pink);color:#fff;font-weight:600}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:#f1e4e9;border-radius:12px;padding:4px;margin-bottom:12px}
.seg button{border:0;background:transparent;border-radius:9px;padding:10px 4px;font-size:14px;cursor:pointer}
.seg button.on{background:#fff;font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.st{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px}
.av{flex:none;width:44px;height:44px;border-radius:50%;background:var(--pink2);color:var(--pink);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:18px}
.st .inf{flex:1;min-width:0}
.st .inf b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:600}
.tag.ok{background:var(--ok2);color:var(--ok)}.tag.bad{background:var(--bad2);color:var(--bad)}.tag.pk{background:var(--pink2);color:var(--pink)}
.pay{flex:none;min-width:104px;border:2px solid var(--pink);background:#fff;color:var(--pink);border-radius:12px;min-height:46px;font-weight:700;cursor:pointer;padding:0 10px}
.pay.paid{background:var(--ok);border-color:var(--ok);color:#fff}
.acts{display:flex;gap:6px;flex:none}
.empty{text-align:center;color:var(--mut);padding:26px 10px}
.cl{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.cl:last-child{border:0}
.cl .inf{flex:1}
/* tabs */
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:30;box-shadow:0 -4px 16px rgba(60,10,30,.06)}
nav button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--mut);padding:6px 0;cursor:pointer;border-radius:12px}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--pink);font-weight:700}
nav button.on svg{stroke-width:2.3}
/* modal */
.ov{position:fixed;inset:0;background:rgba(20,9,13,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#1d1216;color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%}
#toast.on{opacity:1}
footer{text-align:center;padding:10px 12px 14px;font-size:12px;color:var(--mut)}
body.dashmode footer{display:none}
:focus-visible{outline:3px solid #1565c0;outline-offset:2px}

/* ---- animations ---- */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.8)}60%{transform:scale(1.04)}100%{opacity:1;transform:scale(1)}}
@keyframes sweep{0%{top:6%}50%{top:92%}100%{top:6%}}
@keyframes pulse{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fall{0%{transform:translate(0,-20px) rotate(0);opacity:0}15%{opacity:.9}100%{transform:translate(-40px,90px) rotate(260deg);opacity:0}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(194,24,91,.45)}50%{box-shadow:0 0 0 10px rgba(194,24,91,0)}}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(21,122,55,.7)}100%{box-shadow:0 0 0 22px rgba(21,122,55,0)}}
main>section,#body>*{animation:rise .4s ease both}
#body>*:nth-child(2){animation-delay:.05s}#body>*:nth-child(3){animation-delay:.1s}#body>*:nth-child(4){animation-delay:.15s}
.st{animation:rise .35s ease both}
header{position:sticky;overflow:hidden}
header>div,header>button{position:relative;z-index:1}
.petal{position:absolute;top:0;width:10px;height:13px;background:#f6a9c6;border-radius:80% 0 80% 0;opacity:0;animation:fall 6s linear infinite;z-index:0}
.petal:nth-child(2){left:62%;animation-delay:1.2s;transform:scale(.8)}.petal:nth-child(3){left:78%;animation-delay:2.8s}.petal:nth-child(4){left:90%;animation-delay:4.1s;transform:scale(.7)}.petal:nth-child(5){left:48%;animation-delay:3.4s;transform:scale(.6)}
.vf{position:relative;width:100%;aspect-ratio:4/3;max-height:340px;border-radius:20px;background:radial-gradient(circle at 50% 40%,#3a1624,#14090d);overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center}
.vf video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
.vf-idle{text-align:center;color:#f6c6d8;display:flex;flex-direction:column;align-items:center;gap:4px;animation:pulse 2.4s ease-in-out infinite}
.vf-idle svg{width:64px;height:64px;fill:none;stroke:#f6a9c6;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.vf-idle b{font-size:18px;color:#fff}.vf-idle span{font-size:13px;opacity:.8}
.cn{position:absolute;width:34px;height:34px;border:4px solid var(--pink);animation:pulse 1.8s ease-in-out infinite}
.cn.tl{top:14px;left:14px;border-right:0;border-bottom:0;border-radius:12px 0 0 0}
.cn.tr{top:14px;right:14px;border-left:0;border-bottom:0;border-radius:0 12px 0 0}
.cn.bl{bottom:14px;left:14px;border-right:0;border-top:0;border-radius:0 0 0 12px}
.cn.br{bottom:14px;right:14px;border-left:0;border-top:0;border-radius:0 0 12px 0}
.line{position:absolute;left:12%;right:12%;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,#ff5c9d,transparent);box-shadow:0 0 14px 3px rgba(255,92,157,.7);animation:sweep 2.2s ease-in-out infinite}
.vf.live video{display:block}.vf.live .vf-idle{display:none}
.vf.hit{animation:flash .7s ease-out}
#camBtn{animation:glow 2.2s infinite}
.or{display:flex;align-items:center;gap:12px;color:var(--mut);font-size:13px;margin:16px 0 12px}
.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
#scan{margin-top:0;letter-spacing:.06em;transition:box-shadow .2s}
.res{animation:pop .45s cubic-bezier(.2,1.2,.4,1) both}
.ico{width:78px;height:78px;margin:0 auto 6px;display:block}
.ico circle{fill:none;stroke-width:4}
.ico path{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:draw .5s .25s ease forwards}
.ico.ok circle,.ico.ok path{stroke:var(--ok)}.ico.bad circle,.ico.bad path{stroke:var(--bad)}
.ico.q circle,.ico.q path{stroke:var(--pink)}
.nav-anim,nav button{transition:color .2s,transform .15s}
nav button.on svg{animation:pop .3s ease}
.btn,.chip,.pay{transition:transform .12s,background .2s,box-shadow .2s}
.pay.paid{animation:pop .3s ease}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* dashboard v2 */
@keyframes ringin{from{stroke-dashoffset:327}to{stroke-dashoffset:var(--off)}}
@keyframes grow{from{width:0}}
@keyframes up{from{height:0}}
@keyframes shine{0%{transform:translateX(-120%)}100%{transform:translateX(220%)}}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#c2185b,#7b0f3a 70%,#2c1019);color:#fff;border-radius:22px;padding:18px;display:flex;align-items:center;gap:16px;margin-bottom:14px;box-shadow:0 10px 24px rgba(194,24,91,.28)}
.hero:after{content:"";position:absolute;top:0;bottom:0;width:60px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);transform:translateX(-120%);animation:shine 3.6s 1s infinite}
.hero h2{color:#fff;margin:0 0 2px;font-size:20px}.hero p{margin:0;font-size:13px;color:#ffd3e3}
.ringw{position:relative;flex:none;width:112px;height:112px}
.ringw svg{width:112px;height:112px;transform:rotate(-90deg)}
.ringw circle{fill:none;stroke-width:11;stroke-linecap:round}
.ringw .bg{stroke:rgba(255,255,255,.22)}
.ringw .fg{stroke:#fff;stroke-dasharray:327;stroke-dashoffset:var(--off);animation:ringin 1.3s .2s cubic-bezier(.3,.8,.3,1) backwards}
.ringw b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:26px;line-height:1}
.ringw b small{font-size:11px;font-weight:500;opacity:.85;margin-top:3px}
.stat{position:relative;overflow:hidden;transition:transform .15s}
.stat:active{transform:scale(.97)}
.stat .e{position:absolute;right:10px;top:8px;font-size:26px;opacity:.9;animation:pulse 3s ease-in-out infinite}
.bar i{animation:grow 1s .3s cubic-bezier(.3,.8,.3,1) backwards}
.wk{display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:6px}
.wk div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--mut);gap:4px}
.wk i{display:block;width:100%;border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,#e0407f,#c2185b);min-height:4px;animation:up .8s .3s cubic-bezier(.3,.8,.3,1) backwards}
.wk div.t i{background:linear-gradient(180deg,#2fa65a,#157a37)}
.wk b{font-size:12px;color:var(--ink)}
.pl{display:flex;flex-wrap:wrap;gap:8px}
.pl span{background:var(--pink2);color:var(--pink);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600;animation:pop .4s ease both}
#cchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#f6c6d8;margin-right:8px}
#cchip i{width:9px;height:9px;border-radius:50%;background:#888}
#cchip.ok i{background:#4cd27a;box-shadow:0 0 8px #4cd27a}#cchip.bad i{background:#ff6b6b}
pre.sql{background:#1d1216;color:#ffd3e3;padding:12px;border-radius:12px;font-size:12px;overflow:auto;white-space:pre-wrap;margin:8px 0}
ol.steps{padding-left:20px;margin:6px 0 12px;font-size:14px}ol.steps li{margin-bottom:6px}

/* v3: whatsapp, calendar, report */
.fr{display:flex;flex-direction:column;gap:6px;align-items:stretch;flex:none}
.wa{border:0;background:#e3f5e9;color:#157a37;border-radius:10px;min-height:36px;font-weight:700;font-size:13px;cursor:pointer;padding:0 10px}
.wa:active{transform:scale(.96)}
.st .inf{cursor:pointer}
.acts .btn.sm{padding:0 11px;min-width:40px}
.calnav{display:flex;align-items:center;justify-content:space-between;margin-top:14px;gap:8px}
.wd{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:12px;color:var(--mut);margin:10px 0 4px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal i{display:block}
.day{aspect-ratio:1;border:1.5px solid var(--line);background:#fff;border-radius:12px;font-weight:600;cursor:pointer;padding:0}
.day.on{background:var(--pink);border-color:var(--pink);color:#fff;animation:pop .25s ease}
.day.td{border-color:var(--ink);border-width:2px}
.day:disabled{opacity:.3;cursor:default}
.rt{width:100%;border-collapse:collapse;font-size:13px}
.rt th,.rt td{padding:6px 5px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.rt th{border-bottom:2px solid var(--ink)}
#printarea{display:none}
@media print{body>*:not(#printarea){display:none!important}#printarea{display:block!important;padding:10mm;font-family:system-ui,sans-serif;color:#000}
#printarea table{width:100%;border-collapse:collapse;font-size:12px}#printarea th,#printarea td{border:1px solid #999;padding:5px 6px;text-align:left}#printarea h1{margin:0;font-size:20px}body{background:#fff}}

.hist{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.hist button{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:8px 4px;font-size:12.5px;cursor:pointer;line-height:1.25}
.hist button b{display:block;font-size:13px}
.hist button.p{background:var(--ok2);border-color:var(--ok);color:var(--ok)}
.hist button.n{background:var(--bad2);border-color:#f0b9b9;color:var(--bad)}
.rcpt{border:2px dashed #cdb3bd;border-radius:16px;padding:16px;text-align:center;margin-bottom:12px}
.rcpt .amt{font-size:34px;font-weight:800;color:var(--ok);margin:6px 0}
.rcpt table{width:100%;text-align:left;font-size:14px;margin-top:8px}.rcpt td{padding:4px 0}.rcpt td:last-child{text-align:right;font-weight:600}
#undo{margin-top:12px}
</style></head>
<body>
<header>
  <i class="petal" style="left:55%"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i>
  <div><h1>SAKURA</h1><p>Sakura Higher Education Center, Padiyatalawa</p></div>
  <div style="display:flex;align-items:center"><span id="cchip" class="hide"><i></i>Cloud</span><button class="lockbtn hide" id="lock">🔒 Lock</button></div>
</header>
<main>

<section id="v-scan">
  <div class="card scancard">
    <div class="vf" id="vf" role="button" tabindex="0" aria-label="Camera on karanna">
      <video id="vid" playsinline muted></video>
      <canvas id="cv" class="hide"></canvas>
      <div class="vf-idle"><svg viewBox="0 0 24 24"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><rect x="8" y="8" width="3" height="3"/><rect x="13" y="8" width="3" height="3"/><rect x="8" y="13" width="3" height="3"/><path d="M13 13h3v3"/></svg><b>QR scan karanna</b><span>Tap karala camera on karanna</span></div>
      <i class="cn tl"></i><i class="cn tr"></i><i class="cn bl"></i><i class="cn br"></i>
      <div class="line"></div>
    </div>
    <button class="btn p full" id="camBtn" style="margin-top:12px">📷 Camera on karanna</button>
    <div class="or"><span>ho</span></div>
    <label class="f" for="scan">Card number eka gahanna</label>

function tone(seq){if(!sndOn())return;mkAC();if(!AC)return;let t=AC.currentTime;
  seq.forEach(([f,d,ty])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ty||'sine';o.frequency.value=f;
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.3,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.03);t+=d*.9})}

/* scan */
function record(s,date){
  const cid=s.classId;
  const first=!db.att.some(a=>a.code===s.code&&a.date===date&&a.classId===cid);
  if(first){db.att.push({code:s.code,date,classId:cid});save();lastScan={code:s.code,date,classId:cid}}
  tone(paid?SND.ok:SND.due);
  const m=date.slice(0,7),paid=isPaid(s.code,m);
  const vf=$('vf');vf.classList.remove('hit');void vf.offsetWidth;vf.classList.add('hit');
  if(navigator.vibrate)navigator.vibrate(paid?60:[60,60,60]);
  const ic=paid?'<path d="M22 41l12 12 25-26"/>':'<path d="M28 28l24 24M52 28L28 52"/>';
  $('res').innerHTML=`<div class="card res">
    <svg class="ico ${paid?'ok':'bad'}" viewBox="0 0 80 80"><circle cx="40" cy="40" r="35"/>${ic}</svg>
    <h2>${esc(s.name)}</h2><div class="muted">${esc(cname(cid))} &middot; ${date}</div>
    <div class="big ${paid?'ok':'bad'}">${paid?'Fee paid':'Fee not paid'}</div>
    <div>${first?'Class eka dunna (recorded)':'Ada dawase me class eka kalinma record karala'}</div>
    <div class="muted" style="margin-top:6px">Me masa class gaana: ${days(s.code,m).length} dawas</div>${first?'<button class="btn d full" id="undo">↩ Undo — me scan eka ain karanna</button>':''}</div>`;
  $('res').scrollIntoView({behavior:'smooth',block:'nearest'});
  clearTimeout(rt);rt=setTimeout(()=>{$('res').innerHTML=''},10000);
}
async function onScan(raw){
  const code=raw.trim();if(!code)return;
  const s=db.students.find(x=>x.code===code||(x.qr&&x.qr===code));
  if(s){record(s,today());return}
  if(await tryOwner(code))return;
  tone(SND.bad);$('res').innerHTML='<div class="card res"><svg class="ico q" viewBox="0 0 80 80"><circle cx="40" cy="40" r="35"/><path d="M30 31a10 10 0 1 1 14 9c-3 2-4 4-4 8M40 58v1"/></svg><b>Me card eka register wela nehe.</b><div class="muted">Class owner ta kiyanna.</div></div>';
  clearTimeout(rt);rt=setTimeout(()=>{$('res').innerHTML=''},8000);
}

/* attendance calendar */
let calM='';
const shiftM=(m,n)=>{const [y,mo]=m.split('-').map(Number),d=new Date(y,mo-1+n,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
function openStudent(code){if(!db.students.find(x=>x.code===code))return;calM=mon();$('modal').classList.remove('hide');renderCal(code)}
function renderCal(code){
  const s=db.students.find(x=>x.code===code);if(!s)return;
  const [y,mo]=calM.split('-').map(Number),first=new Date(y,mo-1,1).getDay(),dim=new Date(y,mo,0).getDate();
  const set=new Set(days(code,calM)),t=today(),p=isPaid(code,calM),curM=t.slice(0,7);
  const hm=[];for(let i=11;i>=0;i--)hm.push(shiftM(curM,-i));
  let cells='<i></i>'.repeat(first);
  for(let d=1;d<=dim;d++){const ds=calM+'-'+String(d).padStart(2,'0');
    cells+=`<button class="day ${set.has(ds)?'on':''} ${ds===t?'td':''}" data-day="${ds}" ${ds>t?'disabled':''}>${d}</button>`}
  const title=new Date(y,mo-1,1).toLocaleDateString('en',{month:'long',year:'numeric'});
  $('sheet').innerHTML=`<div class="row" style="justify-content:space-between;align-items:flex-start"><div><h2 style="margin:0">${esc(s.name)}</h2><div class="muted">${esc(cname(s.classId))} &middot; ${esc(s.code)}</div></div><span class="tag ${p?'ok':'bad'}">${p?'Paid':'Not paid'}</span></div>
   <div class="calnav"><button class="btn sm" id="cprev">‹</button><b>${title} &middot; ${set.size} dawas</b><button class="btn sm" id="cnext" ${calM>=curM?'disabled':''}>›</button></div>
   <div class="wd">${['S','M','T','W','T','F','S'].map(x=>`<span>${x}</span>`).join('')}</div>
   <div class="cal" id="cal">${cells}</div>
   <p class="muted" style="margin:10px 0">Dawasak tap karala attendance mark karanna, ho ain karanna.</p>
   <h3 style="margin-top:14px">Gaasthu ithihasaya <span class="muted" style="font-weight:400">(tap karala maru karanna)</span></h3>
   <div class="hist" id="hist">${hm.map(h=>{const pd=isPaid(code,h);return `<button data-hm="${h}" class="${pd?'p':'n'}"><b>${new Date(h.slice(0,4),h.slice(5)-1,1).toLocaleDateString('en',{month:'short',year:'2-digit'})}</b>${pd?'✓ '+(paidAmt(code,h)?rs(paidAmt(code,h)):'Paid'):'✕ Nathi'}</button>`}).join('')}</div>
   <button class="btn full" id="cclose" style="margin-top:14px">Wasanna</button>`;
  $('hist').onclick=e=>{const b=e.target.closest('button');if(!b)return;const h=b.dataset.hm;setPaid(code,h,!isPaid(code,h));save();renderCal(code);refresh()};
  $('cprev').onclick=()=>{calM=shiftM(calM,-1);renderCal(code)};
  $('cnext').onclick=()=>{if(calM<curM){calM=shiftM(calM,1);renderCal(code)}};
  $('cclose').onclick=()=>$('modal').classList.add('hide');
  $('cal').onclick=e=>{const b=e.target.closest('.day');if(!b||b.disabled)return;const ds=b.dataset.day;
    if(set.has(ds)){db.att=db.att.filter(a=>!(a.code===code&&a.date===ds));toast(ds.slice(8)+' attendance ain una')}
    else{db.att.push({code,date:ds,classId:s.classId});toast(ds.slice(8)+' attendance mark una ✓')}
    save();renderCal(code);refresh()};
}

  .sort((a,b)=>cname(a.classId).localeCompare(cname(b.classId))||a.name.localeCompare(b.name))
  .map(s=>({s,d:days(s.code,m),p:isPaid(s.code,m)}))}
const monTitle=m=>{const [y,mo]=m.split('-');return new Date(y,mo-1,1).toLocaleDateString('en',{month:'long',year:'numeric'})};
function openReport(cid){
  const m=mon(),r=repData(m,cid||''),paid=r.filter(x=>x.p).length,tot=r.reduce((a,x)=>a+x.d.length,0),inc=r.reduce((a,x)=>a+paidAmt(x.s.code,m),0);

   <div style="overflow:auto;max-height:36vh;margin-bottom:12px"><table class="rt"><thead><tr><th>Student</th><th>Class</th><th>Dawas</th><th>Fee</th></tr></thead><tbody>${r.map(x=>`<tr><td>${esc(x.s.name)}</td><td>${esc(cname(x.s.classId))}</td><td>${x.d.length}</td><td>${x.p?'✓':'✕'}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">Students nehe</td></tr>'}</tbody></table></div>

    const csv='\ufeff'+rows.map(z=>z.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\r\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
    a.download='sakura-report-'+m+(cid?'-'+cname(cid).replace(/\W+/g,'_'):'')+'.csv';a.click();toast('Download una ✓')};

$('body').addEventListener('click',e=>{

    if(!l)return toast('Me student ta phone number nehe. Students tab eken Edit karala add karanna');window.open(l,'_blank');return}

  if(D.rc){openReceipt(D.rc,mon());return}
  if(D.fc!==undefined){fCls=D.fc;draw();return}
  if(D.fp){fPay=D.fp;draw();return}
  if(D.pay){const m0=mon();setPaid(D.pay,m0,!db.paid[D.pay+'|'+m0]);save();
    const y=scrollY;fillFees();scrollTo(0,y);return}
  if(D.d){const s=db.students.find(x=>x.code===D.d);

      db.students=db.students.filter(x=>x.code!==D.d);db.att=db.att.filter(a=>a.code!==D.d);

  if(D.e){editStudent(D.e);return}
  if(D.cf){const c=db.classes.find(x=>x.id===D.cf);const v=prompt(c.name+' — masika gaasthuwa (Rs.)',c.fee||'');

  if(D.cr){const c=db.classes.find(x=>x.id===D.cr);const n=prompt('Class eke aluth nama',c.name);
    if(n&&n.trim()){c.name=n.trim();save();fillScanCls();vClasses()}return}
  if(D.cd){const n=db.students.filter(s=>s.classId===D.cd).length;
    if(n)return alert('Me class eke students '+n+' kenek inne. Palamuwa ewa wenath class ekakata maru karanna, ho delete karanna.');
    if(db.classes.length<2)return alert('Class ekak hari thiyenna oni.');

});

/* pin + lock */
async function tryOwner(code){
  if(Date.now()<(db.lock||0))return false;
  let ok=false;
  try{ok=(await H(code,SALT))===DEF}catch(e){return false}
  if(ok){db.fail=0;delete db.lock;save();unlocked=true;$('res').innerHTML='';tab='home';show('dash');bump();pull();return true}
  db.fail=(db.fail||0)+1;if(db.fail>=5)db.lock=Date.now()+60000*(db.fail-4);save();return false}
function bump(){clearTimeout(idle);if(unlocked)idle=setTimeout(lockNow,300000)}
['click','keydown','mousemove','touchstart'].forEach(e=>document.addEventListener(e,bump));
function lockNow(){unlocked=false;clearTimeout(idle);$('modal').classList.add('hide');show('scan')}
$('lock').onclick=lockNow;

/* camera */
let stream,camTimer,lastC='',lastT=0,bd=null;
async function camOn(){
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}})}
  catch(e){alert('Camera eka open karanna bari una. Camera permission denna.');return}
  const v=$('vid');v.srcObject=stream;$('vf').classList.add('live');await v.play();
  if('BarcodeDetector' in window){try{bd=new BarcodeDetector({formats:['qr_code']})}catch(e){bd=null}}
  if(!bd&&!window.jsQR)await new Promise(r=>{const sc=document.createElement('script');
    sc.src='https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js';sc.onload=sc.onerror=r;document.head.appendChild(sc)});
  if(!bd&&!window.jsQR){alert('Me browser eka camera QR scan support karanne nehe. Internet on karala aye try karanna, ho Chrome use karanna.');camOff();return}
  $('camBtn').textContent='⏹ Camera off karanna';$('camBtn').classList.remove('p');camTimer=setInterval(camTick,250);
}
function camOff(){clearInterval(camTimer);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;
  $('vf').classList.remove('live');$('camBtn').classList.add('p');$('camBtn').textContent='📷 Camera on karanna'}
async function camTick(){
  const v=$('vid');if(v.readyState<2)return;let code='';
  try{if(bd){const r=await bd.detect(v);if(r.length)code=r[0].rawValue}
    else{const c=$('cv'),x=c.getContext('2d',{willReadFrequently:true});c.width=v.videoWidth;c.height=v.videoHeight;
      x.drawImage(v,0,0);const d=x.getImageData(0,0,c.width,c.height),q2=jsQR(d.data,c.width,c.height);if(q2)code=q2.data}}catch(e){}
  const now=Date.now();if(!code||(code===lastC&&now-lastT<4000))return;lastC=code;lastT=now;onScan(code);
}
$('camBtn').onclick=()=>stream?camOff():camOn();
$('vf').onclick=()=>{if(!stream)camOn()};$('vf').onkeydown=e=>{if(e.key==='Enter'&&!stream)camOn()};
let deferredInstall=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;if(unlocked&&tab==='more')vMore()});
(function(){
  function icon(n){const c=document.createElement('canvas');c.width=c.height=n;const x=c.getContext('2d');x.fillStyle='#c2185b';x.fillRect(0,0,n,n);
    x.font=(n*.55)+'px serif';x.textAlign='center';x.textBaseline='middle';x.fillStyle='#fff';x.fillText('🌸',n/2,n/2+n*.03);return c.toDataURL('image/png')}
  try{const base=location.href.split('#')[0];const mf={name:'SAKURA Class Manager',short_name:'SAKURA',start_url:base,scope:base.replace(/[^\/]*$/,''),display:'standalone',background_color:'#14090d',theme_color:'#14090d',
    icons:[{src:icon(192),sizes:'192x192',type:'image/png'},{src:icon(512),sizes:'512x512',type:'image/png'}]};
    const l=document.createElement('link');l.rel='manifest';l.href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify(mf));document.head.appendChild(l)}catch(e){}
})();
fillScanCls();show('scan');chip();pull();
</script>
